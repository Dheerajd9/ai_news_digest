name: World Brief - run all editions now

# Lets Claude (or you) trigger a full test of every edition without clicking anything:
# push a change to world_brief/run_request.txt and GitHub runs morning -> weekly -> evening
# for real (emails + podcasts), one after another. Morning/weekly already sent today are
# skipped (no duplicates); evening sent outside 6-11 PM doesn't block tonight's real one.

on:
  push:
    branches: [main]
    paths: ["world_brief/run_request.txt"]

permissions:
  contents: write

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: world-brief
      cancel-in-progress: false
    defaults:
      run:
        working-directory: world_brief
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world_brief/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run morning, weekly, evening
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PODCAST_REPO: ${{ vars.PODCAST_REPO }}
          PODCAST_TOKEN: ${{ secrets.PODCAST_TOKEN }}
          PARENTS_EMAIL: ${{ secrets.PARENTS_EMAIL }}
          PARENTS_WHATSAPP: ${{ secrets.PARENTS_WHATSAPP }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FAILED=""
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          D=$(TZ=America/Chicago date +%F)
          mkdir -p logs
          # Last line of run_request.txt may say e.g. "run: morning force" (default: all three).
          REQ=$(tail -n 1 run_request.txt | tr 'A-Z' 'a-z')
          CMD=$(echo "$REQ" | sed -n 's/.*run:\([^(]*\).*/\1/p')    # only the words after "run:", before any "(note)"
          EDS=$(echo "$CMD" | grep -oE '\b(morning|weekly|evening)\b' | awk '!seen[$0]++' | tr '\n' ' ')
          [ -z "$EDS" ] && EDS="morning weekly evening"
          FORCE=$(echo "$CMD" | grep -qw force && echo 1 || echo 0)
          if echo "$CMD" | grep -qw sitesync; then
            python sitesync.py
            exit 0
          fi
          if echo "$CMD" | grep -qw keycheck; then
            python keycheck.py
            exit 0
          fi
          echo "Requested: $EDS (force=$FORCE)"
          for ED in $EDS; do
            if [ "$ED" = weekly ] && [ "$(TZ=America/Chicago date +%u)" != 7 ]; then
              echo "== weekly: not Sunday, running anyway as a test =="
            fi
            if [ "$FORCE" = 0 ] && [ -e "state/done/$D-$ED" ]; then
              echo "== $ED already sent today, skipping =="; continue
            fi
            echo "================ $ED ================"
            rm -rf out
            set -o pipefail
            if ! EDITION=$ED python digest.py 2>&1 | tee "logs/latest-$ED.log"; then
              echo "!! $ED failed"; FAILED="$FAILED $ED"
              EDITION="$ED (run-now)" python3 notify_failure.py || true
            elif [ "$FORCE" = 0 ]; then
              mkdir -p state/done; date -u +%FT%TZ > "state/done/$D-$ED"   # sent: never again today
            fi
            for f in state/seen.json state/stories.json state/source_quality.json state/trends.json \
                     state/entities.json state/beliefs.json state/scorecard.json state/tts_usage.json state/done briefs logs; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "World brief ($ED, run-now) $(date -u +%F)"
              git pull --rebase --quiet && git push
            fi
          done
          if [ -n "$FAILED" ]; then echo "Failed editions:$FAILED"; exit 1; fi
