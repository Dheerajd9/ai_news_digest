name: Breaking Alerts

# Every 2 hours, 7 AM to 11 PM Dallas time (CDT; one hour earlier in winter).
# Checks your watchlist; sends a Telegram ping (or email) only for truly big news.
# Free: ~1 min per run, GitHub Models scores importance.

on:
  schedule:
    - cron: "17 12,14,16,18,20,22,0,2,4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  models: read

concurrency:
  group: breaking-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: world_brief
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world_brief/requirements.txt

      - run: pip install feedparser requests PyYAML Markdown

      # Remember which headlines were already checked (kept in the Actions cache,
      # so the repo doesn't get a commit every 2 hours).
      - uses: actions/cache/restore@v4
        with:
          path: world_brief/state/alerts_seen.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Check for breaking news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: world_brief/state/alerts_seen.json
          key: alerts-state-${{ github.run_id }}
