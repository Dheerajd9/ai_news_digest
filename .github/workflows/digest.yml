name: AI News Digest

on:
  schedule:
    # GitHub cron runs in UTC. Times below are ~7 AM and ~6 PM in Texas during
    # daylight time (CDT, UTC-5). From Nov 1 (CST, UTC-6) they arrive an hour
    # earlier: ~6 AM and ~5 PM. GitHub can also delay scheduled runs 5-30 min.
    - cron: "7 12 * * *"   # morning
    - cron: "7 23 * * *"   # evening
  workflow_dispatch:        # lets you click "Run workflow" to test anytime
  push:                     # code changes trigger a test run that does NOT send email
    branches: [main]
    paths: ["digest.py", "requirements.txt", ".github/workflows/digest.yml"]

permissions:
  contents: read
  models: read              # free GitHub Models access via GITHUB_TOKEN

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python digest.py --dry-run
          else
            python digest.py
          fi
