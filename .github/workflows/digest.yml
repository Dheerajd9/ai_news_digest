name: AI News Digest

on:
  schedule:
    # GitHub cron is UTC only. Each edition has two slots: one matches 7 AM / 6 PM
    # Texas time in summer (CDT, UTC-5) and the other in winter (CST, UTC-6).
    # digest.py checks which slot matches today and quietly skips the other one,
    # so emails arrive at ~7:07 AM and ~6:07 PM all year (GitHub may start a few minutes late).
    - cron: "7 12 * * *"   # 7:07 AM CDT
    - cron: "7 13 * * *"   # 7:07 AM CST
    - cron: "7 23 * * *"   # 6:07 PM CDT
    - cron: "7 0 * * *"    # 6:07 PM CST
  workflow_dispatch:        # lets you click "Run workflow" to test anytime
  push:                     # code changes trigger a test run that does NOT send email
    branches: [main]
    paths: ["digest.py", "portfolio_analytics.py", "requirements.txt", ".github/workflows/digest.yml"]

permissions:
  contents: write           # to save sent.json / alerts.json (remembers what was sent)

concurrency:
  group: digest             # never run two digests at the same time
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python digest.py --dry-run
          else
            python digest.py
          fi

      - name: Remember sent stories
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain sent.json alerts.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            for f in sent.json alerts.json; do [ -f "$f" ] && git add "$f"; done
            git commit -m "Update sent stories and alert state"
            git pull --rebase --quiet
            git push
          fi
