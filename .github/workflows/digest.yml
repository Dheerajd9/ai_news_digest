name: AI News Digest

on:
  schedule:
    # GitHub cron is UTC and sometimes drops runs, so each edition has backup slots.
    # digest.py sends an edition only if it is due in Texas local time (morning 7 AM-1:59 PM,
    # evening 6-9 PM) and not already sent today (digest_done.json); other slots skip.
    - cron: "7 12-18 * * *"   # morning slots: CDT 7:07 AM-1:07 PM / CST 6:07 AM-12:07 PM (backups)
    - cron: "7 23 * * *"      # evening: CDT 6:07 PM
    - cron: "7 0-2 * * *"     # evening backups: CDT 7-9 PM / CST 6-8 PM
  workflow_dispatch:        # lets you click "Run workflow" to test anytime
  push:                     # code changes trigger a test run that does NOT send email
    branches: [main]
    paths: ["digest.py", "portfolio_analytics.py", "requirements.txt", ".github/workflows/digest.yml",
            "digest_run_request.txt"]   # commit message with [send digest] = send for real

permissions:
  contents: write           # to save sent.json / alerts.json (remembers what was sent)

concurrency:
  group: digest             # never run two digests at the same time
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_REQUEST: ${{ contains(github.event.head_commit.message, '[send digest]') }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$RUN_REQUEST" != "true" ]; then
            python digest.py --dry-run
          else
            python digest.py
          fi

      - name: Remember sent stories
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[send digest]')
        run: |
          if [ -n "$(git status --porcelain sent.json alerts.json digest_done.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            for f in sent.json alerts.json digest_done.json; do [ -f "$f" ] && git add "$f"; done
            git commit -m "Update sent stories and alert state"
            git pull --rebase --quiet
            git push
          fi
