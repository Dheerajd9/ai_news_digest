name: Portfolio Report

on:
  schedule:
    - cron: "7 13 1,16 * *"   # 1st and 16th of every month, ~8 AM CDT / ~7 AM CST
  workflow_dispatch:           # click "Run workflow" to get a report anytime
  push:                        # code/portfolio changes trigger a test run that does NOT send email
    branches: [main]
    paths: ["portfolio_report.py", "portfolio_analytics.py", "report_sections.py", "portfolio.json", ".github/workflows/portfolio.yml"]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false   # this job never pushes

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send portfolio report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python portfolio_report.py --dry-run
          else
            python portfolio_report.py
          fi
