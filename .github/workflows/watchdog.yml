name: Watchdog

# Every afternoon: alerts Dji if today's emails were never sent (the silent failure where
# nothing ran at all). Sundays: tests every news feed and removes feeds dead two weeks in a row.
# Two UTC slots so one lands on 2 PM US Eastern in both summer and winter time; watchdog.py
# acts only in the 2 PM slot. Free, about 1 minute.

on:
  schedule:
    - cron: "50 18,19 * * *"   # EDT 2:50/3:50 PM, EST 1:50/2:50 PM -> one is the 2 PM hour
  workflow_dispatch:
    inputs:
      feedcheck:
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # to see if an edition is still running

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: world_brief
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world_brief/requirements.txt

      - run: pip install -r requirements.txt

      - name: Wait while an edition is still running (no false alarm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "START_H=$(TZ=America/New_York date +%H)" >> "$GITHUB_ENV"   # the slot's hour, before waiting
          for i in $(seq 1 45); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w world_brief.yml -L 5 --json status \
                  -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null || echo 0)
            m=$(gh run list -R "$GITHUB_REPOSITORY" -w world_brief_run_now.yml -L 3 --json status \
                  -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null || echo 0)
            [ "$n" = 0 ] && [ "$m" = 0 ] && break
            echo "an edition is still running; waiting a minute"; sleep 60
          done
          git pull --quiet origin main   # see the "sent" markers that run just saved

      - name: Check today's emails (and feeds on Sunday)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEEDCHECK: ${{ inputs.feedcheck && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python watchdog.py 2>&1 | sed -u -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'

      - name: Save feed health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for f in feeds.yaml state/feed_health.json logs/feedcheck.txt; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Weekly feed check"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 10; done
          fi
