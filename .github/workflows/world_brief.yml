name: World Brief + Podcast

# India-first news brief + two-host audio podcast, emailed to TO_EMAIL. 100% free:
# Gemini free tier, GitHub Models backup (built-in token), edge-tts voices, Gmail SMTP.
#
# GitHub cron is UTC. Times below are Dallas summer time (CDT); in winter (CST)
# everything arrives one hour earlier. GitHub may start runs a few minutes late.

on:
  schedule:
    - cron: "37 12 * * *"   # morning  7:37 AM CDT  (India ~6 PM: India's day is done)
    - cron: "7 23 * * *"    # evening  6:07 PM CDT  (US day + markets closed)
    - cron: "7 14 * * 0"    # weekly   Sunday 9:07 AM CDT deep dive
  workflow_dispatch:
    inputs:
      edition:
        description: "Which edition to send now"
        type: choice
        options: [morning, evening, weekly]
        default: morning
  push:                      # code changes: quick test run, no AI, no email
    branches: [main]
    paths: ["world_brief/**", ".github/workflows/world_brief.yml"]

permissions:
  contents: write            # save world_brief/state + briefs archive (story memory)
  models: read               # GitHub Models free backup brain

concurrency:
  group: world-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: world_brief
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world_brief/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Pick edition
        id: ed
        env:                       # passed as env, never pasted into the script (injection-safe)
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_EDITION: ${{ inputs.edition }}
        run: |
          case "$SCHEDULE" in
            "7 23 * * *") ED=evening ;;
            "7 14 * * 0") ED=weekly ;;
            "") ED="$INPUT_EDITION" ;;
            *) ED=morning ;;
          esac
          case "$ED" in morning|evening|weekly) ;; *) ED=morning ;; esac
          echo "edition=$ED" >> "$GITHUB_OUTPUT"
          echo "Edition: $ED"

      - name: Build brief + podcast and send
        env:
          EDITION: ${{ steps.ed.outputs.edition }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PODCAST_REPO: ${{ vars.PODCAST_REPO }}
          PODCAST_TOKEN: ${{ secrets.PODCAST_TOKEN }}
          PARENTS_EMAIL: ${{ secrets.PARENTS_EMAIL }}
          PARENTS_WHATSAPP: ${{ secrets.PARENTS_WHATSAPP }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            DRY_RUN=1 NO_LLM=1 python digest.py | tail -60
            python -c "import markets; b, p = markets.numbers_box(); print(b or 'numbers box: no data'); print(p)"
            DRY_RUN=1 NO_LLM=1 python alerts.py
          else
            python digest.py
          fi

      # MP3 also kept as a downloadable run artifact for 14 days (not committed).
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: world-brief-${{ steps.ed.outputs.edition }}-podcast
          path: world_brief/out/*.mp3
          retention-days: 14
          if-no-files-found: ignore

      - name: Save state and archive
        if: github.event_name != 'push'
        env:
          EDITION: ${{ steps.ed.outputs.edition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json briefs 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "World brief ($EDITION) $(date -u +%F)"
            git pull --rebase --quiet
            git push
          fi
